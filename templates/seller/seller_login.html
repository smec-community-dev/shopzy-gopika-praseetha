<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopSphere</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
        <!-- Header Gradient Bar -->
        <div class="h-2 bg-gradient-to-r from-purple-600 to-teal-400"></div>

        <div class="p-8">
            <!-- Logo & Header -->
            <div class="text-center mb-8">
                <div class="flex items-center justify-center mb-4">
                    <i class="fas fa-shopping-bag text-3xl text-purple-600 mr-2 transform -rotate-12"></i>
                    <span class="text-3xl font-bold text-purple-600">ShopSphere</span>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Welcome Back</h2>
                <p class="text-gray-600">Sign in to your account</p>
            </div>
           {% if messages %}
           {% for message in messages %}
         <p style="color: red; font-weight: bold; text-align:center;">
            {{ message }}
           </p>
        {% endfor %}
     {% endif %}

            <!-- Login Form -->
            <form method="POST">
                {% csrf_token %}

                <!-- Role Selector -->
                <div class="flex border border-gray-300 rounded-lg overflow-hidden mb-6">
                    <label class="flex-1 text-center py-3 bg-purple-600 text-white cursor-pointer">
                        <input type="radio" name="role" value="customer" class="hidden" checked>
                        <span class="font-medium">Customer</span>
                    </label>
                    <label class="flex-1 text-center py-3 bg-white text-gray-700 hover:bg-gray-50 cursor-pointer">
                        <input type="radio" name="role" value="seller" class="hidden">
                        <span class="font-medium">Seller</span>
                    </label>
                </div>

                <!-- Username -->
                <div class="mb-4">
                    <label for="username" class="block text-gray-700 font-medium mb-2">Username</label>
                    <input type="text" id="username" name="username"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                           placeholder="Enter your username" required>
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label for="password" class="block text-gray-700 font-medium mb-2">Password</label>
                    <input type="password" id="password" name="password"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                           placeholder="Enter your password" required>
                </div>

                <!-- Forgot Password -->
                <div class="text-right mb-6">
                    <a href="{% url 'forgott_password' %}" class="text-purple-600 hover:text-purple-700 text-sm font-medium">Forgot your password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                        class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 transform hover:-translate-y-1">
                    Sign In
                </button>

                <!-- Footer Link -->
                <div class="text-center mt-6">
                    <p class="text-gray-600">
                        Don't have an account?
                        <a href="{% url 'seller_register' %}" class="text-purple-600 font-medium hover:text-purple-700">Sign up here</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
