<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dummy Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-xl mx-auto mt-20 bg-white p-8 rounded-2xl shadow-lg text-center">

    <h1 class="text-3xl font-bold mb-4">Dummy Payment</h1>

    <p class="text-gray-700 mb-4">
        Order ID: <strong>{{ order.slug }}</strong>
    </p>

    <p class="text-xl font-semibold mb-6">
        Total Amount: ₹{{ order.total_amount }}
    </p>

    <p class="text-gray-600 mb-6">
        This is a dummy payment page. Click "Pay Now" to continue.
    </p>

    <a href="{% url 'user_view_cart' %}"
       class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-bold inline-block">
        Pay Now
    </a>

</div>

</body>
</html>
