<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ShopSphere</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-8">
        <h2 class="text-3xl font-bold text-center text-purple-700 mb-6">Admin Login</h2>

        {% if messages %}
            {% for message in messages %}
                <p class="text-center text-red-600 font-semibold mb-3">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1">Username</label>
                <input type="text" name="username"
                       class="w-full py-3 px-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                       placeholder="Enter Username" required>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-1">Password</label>
                <input type="password" name="password"
                       class="w-full py-3 px-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                       placeholder="Enter Password" required>
            </div>

            <button type="submit"
                    class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-lg font-semibold transition">
                Login
            </button>
        </form>
    </div>

</body>
</html>
